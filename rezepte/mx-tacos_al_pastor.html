const headline = 'Tacos al <em>Pastor</em>';

  ["", "Zunächst wird die Marinade hergestellt. Dazu werden die Knoblauchzehen abgezogen und grob gehackt. Der Stielansatz der Tomaten wird entfernt und die Tomaten werden grob gewürfelt. Die Chilis werden entkernt und kleingeschnitten. Die Orangen werden halbiert und ausgepresst. Das alles kommt zusammen mit den restlichen Zutaten der Marinade in ein hohes Mixgefäß und wird mit einem Pürierstab zerkleinert. Das Fleisch wird in 1,5 cm dicke Scheiben geschnitten und zusammen mit der Marinade in einen Vakuumbeutel gegeben und die Marinade darin gut mit dem Fleisch vermengt. Dann wird der Beutel vakuumiert und für 2-3 Stunden in den Kühlschrank zum Marinieren gelegt.", ""],
  ["", "Der Grill wird auf 180°C vorgeheizt und der Heckbrenner läuft dabei auf mittlerer Stufe mit. Die Ananas wird geschält und in Scheiben geschnitten. Der Strunk bleibt dabei in den Scheiben erhalten, damit die Scheiben besser auf dem Spieß halten. Die Zwiebel wird abgezogen und halbiert. Das marinierte Fleisch wird aus dem Vakuum geholt und der Spieß wird bestückt. Zuerst wird eine Zwiebelhälfte aufgespießt, dann folgt immer abwechselnd eine Scheibe Fleisch und eine Scheibe Ananas. Zum Abschluss wird die andere Zwiebelhälfte auf den Spieß gesteckt und das Grillgut mit den Spießkrallen zusammengedrückt und befestigt. Zur besseren Temperaturkontrolle haben wir den Spieß mit unserem Grillthermometer bestückt und eine Ziel-Kerntemperatur von 63°C eingestellt. Für Iberico-Fleisch ist das die ideale Kerntemperatur. Solltet ihr herkömmliches Schweinefleisch verwenden, sollte ggf. eine höhere Kerntemperatur angepeilt werden (bei Schweinenacken ca. 75°C).", ""],
  ["", "Nun wird der Spieß eingehangen und der Motor wird eingeschaltet. Unter dem Drehspieß sollte auf dem Grillrost eine Schale mit Wasser platziert werden, damit sich heruntertropfendes Fett und Fleischsäfte nicht einbrennen. Der Drehspieß wird bei geschlossenen Deckel für etwa 60 Minuten gegart, bis das Fleisch die gewünschte Kerntemperatur erreicht hat. In der Zwischenzeit wird der Koriander gewaschen und fein gehackt und die Limette wird halbiert. Wenn der Spieß die Ziel-Kerntemperatur erreicht hat, kann das Fleisch mit der Ananas vorsichtig heruntergeschnitten werden.", ""],
